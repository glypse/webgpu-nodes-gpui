[package]
name = "shader-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
serde.workspace = true
# Without it parsed floats can differ in the last digit, which changes library versions.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
