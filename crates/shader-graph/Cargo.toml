[package]
name = "shader-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
log.workspace = true
serde.workspace = true
graph-math = { path = "../graph-math" }
# Without it parsed floats can differ in the last digit, which changes library versions.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
# Exact pin: ELK's placement changes between releases, so layouts would shift on upgrade.
elk-layout = "=0.12.2"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
runtime = { path = "../runtime" }
