[package]
name = "export"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Renders a shader graph frame by frame at a fixed timestep and encodes it as a MOV or MKV with FFmpeg"

[dependencies]
runtime = { path = "../runtime" }
shader-graph = { path = "../shader-graph" }
log.workspace = true
anyhow.workspace = true
thiserror.workspace = true
ffmpeg-next = { version = "=9.1.0", default-features = false, features = ["codec", "format", "software-scaling", "build"] }
