[package]
name = "runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "wgpu runtime drawing the shader programs webgpu-nodes generates"

[dependencies]
log.workspace = true
wgpu.workspace = true
shader-graph = { path = "../shader-graph" }
anyhow.workspace = true
thiserror.workspace = true
pollster.workspace = true
half = "2"
rayon = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVPixelBufferPool", "CVReturn", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["IOSurfaceRef", "objc2-core-foundation"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "objc2-io-surface"] }
