[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
gpui = { package = "gpui-fast", version = "0.1.17" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.17", features = ["font-kit"] }
wgpu = "30"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
kurbo = "0.13"
palette = { version = "0.7.7", default-features = false, features = ["std"] }
gpui-component = { version = "0.10.0", default-features = false, features = ["gpui-fast"] }
gpui-kit-assets = { version = "0.10.0", default-features = false, features = ["gpui-fast"] }

# Dependencies (wgpu, naga, image…) optimised even in dev: tests and the debug app are much faster.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = "line-tables-only"

# gpui-fast-apple 0.1.17 plus BGRA surface support (the published crate with one commit on top).
[patch.crates-io]
gpui-fast-apple = { git = "https://github.com/glypse/gpui-fast", rev = "5e132f5a6a4e36f7cd0983793621aeaa5e08e84e" }
