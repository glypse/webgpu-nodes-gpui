[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
gpui = { package = "gpui-fast", version = "0.1.17" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.17", features = ["font-kit"] }
wgpu = "30"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
kurbo = "0.13"
palette = { version = "0.7.7", default-features = false, features = ["std"] }
gpui-component = { version = "0.10.0", default-features = false, features = ["gpui-fast"] }
gpui-kit-assets = { version = "0.10.0", default-features = false, features = ["gpui-fast"] }

# Dependencies (wgpu, naga, image…) optimised even in dev: tests and the debug app are much faster.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = "line-tables-only"

# Our gpui-fast fork: BGRA surface support for gpui-fast-apple, and an opt-in
# unsnapped layout (`Div::unsnapped_layout`, `Window::with_layout_snapping`)
# that keeps fractional sizes exact during zoom animations.
[patch.crates-io]
gpui-fast = { git = "https://github.com/glypse/gpui-fast", rev = "6a4e9a9aaa08c6470a62f1f07bcaab1e095adb5b" }
gpui-fast-apple = { git = "https://github.com/glypse/gpui-fast", rev = "6a4e9a9aaa08c6470a62f1f07bcaab1e095adb5b" }
